[project]
name = "fly-cartpole"
version = "0.1.0"
description = "A connectome mushroom body learning CartPole with its own dopamine plasticity rule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "numpy>=2.0",
]

[project.optional-dependencies]
extract = [
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.scripts]
fly-cartpole = "fly_cartpole.cli:main"

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_cartpole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
